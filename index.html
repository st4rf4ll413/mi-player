<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <title>Mídia Player</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=hd" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=music_note_2" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite" />
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <div class="logo-header">
            <img src="assets/logo-ytmusic.svg" alt="Logo do Youtube Music" class="logo">
            <p class="logo-text">Music</p>
        </div>
        <div class="account">
            <span class="badge tag-account">ONLINE · CONTA PREMIUM</span> 
        </div>
    </header>
    <main>
        <section>
            <div class="player">
                <div class="video-player">
                    <img src="assets/capa-player.svg" alt="Midnight Drive (Clipe Oficial) thumbnail" class="thumbnail-player">
                    <p class="badge tag-res"><span class="material-symbols-outlined">hd</span> 1080p HD</p>
                    <p class="badge tag-format"><span class="material-symbols-outlined">music_note_2</span>Música · Video</p>
                    <p class="badge tag-timestamp">02:15 / 03:40</p>
                    <p class="badge tag-like"><span class="material-symbols-sharp">favorite</span>Curtir</p>
                </div>
                <div>

                </div>
            </div>
        </section>
    </main>
</body>
</html>
